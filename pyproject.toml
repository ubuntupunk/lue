[tool.poetry]
name = "lue"
version = "0.1.0"
description = "A terminal-based eBook reader with modular text-to-speech capabilities and multi-format support"
authors = ["Lue Development Team"]
license = "GPL-3.0"
readme = "README.md"
homepage = "https://github.com/superstarryeyes/lue"
repository = "https://github.com/superstarryeyes/lue"
documentation = "https://github.com/superstarryeyes/lue/blob/main/README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing",
    "Environment :: Console",
]

[tool.poetry.dependencies]
python = ">=3.10"
python-docx = ">=1.2.0"
striprtf = ">=0.0.29"
rich = ">=14.1.0"
PyMuPDF = ">=1.26.3"
Markdown = ">=3.8.2"
platformdirs = ">=4.3.8"
edge-tts = ">=7.2.0"

[tool.poetry.extras]
kokoro = ["kokoro>=0.9.4", "soundfile>=0.13.1", "huggingface-hub>=0.34.4"]

[tool.poetry.scripts]
lue = "lue.__main__:cli"

[tool.poetry.group.dev.dependencies]
build = "^1.3.0"
twine = "^6.1.0"
ruff = "^0.12.9"
mypy = "^1.17.1"
pytest = "^8.4.1"
pre-commit = "^4.3.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
